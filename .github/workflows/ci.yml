name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MamCom.sln

      - name: Build
        run: dotnet build MamCom.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution MamCom.sln --configuration Release --no-build

      # Enable after PLAN 2.2 (DataBuilder validate is implemented).
      - name: Validate data
        if: ${{ false }}
        run: dotnet run --project tools/MamCom.DataBuilder --configuration Release --no-build -- validate
