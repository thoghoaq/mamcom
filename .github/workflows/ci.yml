name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MamCom.sln

      - name: Build
        run: dotnet build MamCom.sln --configuration Release --no-restore

      # The end-to-end tests (tests/MamCom.E2E) publish the app, make a bundle of the frozen seed, serve both and drive them in a browser at
      # 360x740. CI has no browser of its own that the tests can rely on, so the one Playwright fetches is installed; a missing browser fails the
      # run here (the tests skip on a machine that has none, and only here, where CI is set, do they fail).
      - name: Install the browser of the end-to-end tests
        run: pwsh tests/MamCom.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --solution MamCom.sln --configuration Release --no-build

      - name: Validate data
        run: dotnet run --project tools/MamCom.DataBuilder --configuration Release --no-build -- validate

      - name: Build data bundle (dev)
        run: dotnet run --project tools/MamCom.DataBuilder --configuration Release --no-build -- build --out dist
