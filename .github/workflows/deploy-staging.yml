name: deploy-staging

# The app and a bundle of the data, to the Vercel project of staging (PLAN 3.10, ADR-029): https://mamcom-pi.vercel.app
# Runs after ci is green on main, or by hand. Until the owner has added a Vercel token as the secret VERCEL_TOKEN, it builds
# everything and says it skipped the upload, instead of failing.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Which Vercel project: not secrets, the same ids `vercel link` writes to .vercel/project.json.
  VERCEL_ORG_ID: team_yIhL8XHKZfi4dWdUeM4CfOIA
  VERCEL_PROJECT_ID: prj_Vig05ORc1yTAMopaAOXiuPsjIo1j
  SITE: https://mamcom-pi.vercel.app

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit ci tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the app
        run: dotnet publish src/MamCom.Web/MamCom.Web.csproj --configuration Release --output publish

      # The bundle is deployed beside the app, not inside it (ADR-020). A published folder may carry a bundle of a local run; it goes, and the
      # bundle of the data in the repository takes its place. Staging takes the dev bundle: no dish is reviewed yet, so a release bundle would
      # be empty (ADR-011), and the app says "dữ liệu thử" on every page. Vercel compresses what it serves, so the precompressed copies stay home.
      - name: Build the data bundle
        run: |
          rm -f publish/wwwroot/data-*
          rm -rf publish/wwwroot/images
          dotnet run --project tools/MamCom.DataBuilder --configuration Release -- build --out publish/wwwroot
          mkdir -p reports
          mv publish/wwwroot/data-report.md reports/data-report.md
          find publish/wwwroot \( -name '*.br' -o -name '*.gz' \) -delete

      - name: Keep the data report
        uses: actions/upload-artifact@v7
        with:
          name: data-report
          path: reports/data-report.md

      - name: Is there a Vercel token?
        id: token
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging not deployed::The secret VERCEL_TOKEN is not set. Everything was built; the upload was skipped (docs/deploy-staging.md)."
          fi

      - name: Upload to Vercel
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@50.1.3 deploy publish/wwwroot --prod --yes --token "$VERCEL_TOKEN"

      - name: The site answers with the app and the data
        if: steps.token.outputs.present == 'true'
        run: |
          set -e
          curl --fail --silent --show-error "$SITE/" | grep -q '_framework/blazor.webassembly'
          curl --fail --silent --show-error "$SITE/nha-minh" | grep -q '_framework/blazor.webassembly'
          curl --fail --silent --show-error "$SITE/data-version.json" | grep -q '"version"'
          echo "Staging: $SITE" >> "$GITHUB_STEP_SUMMARY"
